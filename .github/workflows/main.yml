name: Scholar Inbox digest

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx python-dotenv mcp
      - run: python digest_bot.py --now
        env:
          SCHOLAR_INBOX_MCP_TOKEN: ${{ secrets.SCHOLAR_INBOX_MCP_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
